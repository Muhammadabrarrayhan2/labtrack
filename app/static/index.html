<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand"><span class="logo">LT</span><div><h1>LabTrack</h1><p>Pencatatan praktikum laboratorium</p></div></div>
      <label for="login-email">Email</label>
      <input id="login-email" name="username" type="email" required autocomplete="username" placeholder="nama@kampus.ac.id">
      <label for="login-password">Kata sandi</label>
      <input id="login-password" name="password" type="password" required autocomplete="current-password">
      <button type="submit" class="primary" id="login-submit">Masuk</button>
      <p class="hint">Akun dibuat oleh koordinator laboratorium. Lupa kata sandi? Hubungi koordinator.</p>
      <div id="login-error" class="alert" hidden></div>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand small"><span class="logo">LT</span><strong>LabTrack</strong></div>
      <label class="course-pick">Mata kuliah
        <select id="course-select" aria-label="Pilih mata kuliah"></select>
      </label>
      <div class="me"><span id="me-name"></span><span id="me-role" class="badge"></span><button id="logout" class="ghost">Keluar</button></div>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="rekap" aria-selected="true">Rekap kehadiran</button>
      <button role="tab" data-view="kehadiran">Input kehadiran</button>
      <button role="tab" data-view="mahasiswa">Mahasiswa</button>
      <button role="tab" data-view="laporan">Laporan praktikum</button>
      <button role="tab" data-view="admin" data-admin hidden>Kelola</button>
    </nav>
    <div id="flash" class="alert" hidden></div>
    <section id="view" class="view" aria-live="polite"></section>
    <footer class="foot">LabTrack <span id="version"></span> · <a href="/docs" target="_blank" rel="noopener">Dokumentasi API</a> · Jika ada galat, sertakan kode request_id saat melapor.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
